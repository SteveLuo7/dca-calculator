<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试市场UI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
    .panel { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #2ecc96; }
    .market-tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid #e0e0e0; padding-bottom: 12px; }
    .market-tab { border: 1px solid #e0e0e0; background: transparent; color: #666; border-radius: 6px; padding: 8px 16px; font-size: 12px; cursor: pointer; transition: .15s; flex: 1; text-align: center; }
    .market-tab:hover { border-color: #ccc; color: #333; }
    .market-tab.active { background: #2ecc96; color: #fff; border-color: #2ecc96; }
    .market-content { display: none; }
    .market-content.active { display: block; }
    .market-section { margin-bottom: 20px; }
    .market-section:last-child { margin-bottom: 0; }
    .section-title { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 8px; padding: 6px 10px; background: #f8f8f8; border-radius: 4px; }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .asset-card { background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; cursor: pointer; transition: .15s; }
    .asset-card:hover { border-color: #2ecc96; transform: translateY(-2px); }
    .asset-code { font-family: monospace; font-size: 11px; color: #4f8ef7; margin-bottom: 4px; }
    .asset-name { font-size: 13px; color: #333; font-weight: 500; }
    .loading { text-align: center; padding: 20px; color: #999; }
    .empty { text-align: center; padding: 20px; color: #999; }
  </style>
</head>
<body>
  <h1>市场选择模块UI测试</h1>
  <p>这个页面用于测试新的市场选择界面（不连接后端）</p>

  <div class="panel">
    <div class="panel-title">🌍 选择市场</div>

    <!-- 市场标签页 -->
    <div class="market-tabs" id="marketTabs">
      <button class="market-tab" data-market="asia">🏯 亚洲市场</button>
      <button class="market-tab active" data-market="europe">🏰 欧洲市场</button>
      <button class="market-tab" data-market="americas">🗽 美洲市场</button>
    </div>

    <!-- 亚洲市场内容 -->
    <div class="market-content" id="asiaContent">
      <div class="market-section">
        <div class="section-title">📈 权重股票</div>
        <div class="asset-grid" id="asiaStockGrid">
          <div class="loading">加载股票...</div>
        </div>
      </div>
      <div class="market-section">
        <div class="section-title">💰 基金</div>
        <div class="asset-grid" id="asiaFundGrid">
          <div class="loading">加载基金...</div>
        </div>
      </div>
    </div>

    <!-- 欧洲市场内容 -->
    <div class="market-content active" id="europeContent">
      <div class="market-section">
        <div class="section-title">📈 权重股票</div>
        <div class="asset-grid" id="europeStockGrid">
          <div class="asset-card">
            <div class="asset-code">ASML</div>
            <div class="asset-name">阿斯麦</div>
          </div>
          <div class="asset-card">
            <div class="asset-code">SAP</div>
            <div class="asset-name">SAP</div>
          </div>
          <div class="asset-card">
            <div class="asset-code">NESN</div>
            <div class="asset-name">雀巢</div>
          </div>
          <div class="asset-card">
            <div class="asset-code">HSBA</div>
            <div class="asset-name">汇丰控股</div>
          </div>
        </div>
      </div>
      <div class="market-section">
        <div class="section-title">💰 基金</div>
        <div class="asset-grid" id="europeFundGrid">
          <div class="loading">加载基金...</div>
        </div>
      </div>
    </div>

    <!-- 美洲市场内容 -->
    <div class="market-content" id="americasContent">
      <div class="market-section">
        <div class="section-title">📈 权重股票</div>
        <div class="asset-grid" id="americasStockGrid">
          <div class="loading">加载股票...</div>
        </div>
      </div>
      <div class="market-section">
        <div class="section-title">💰 基金</div>
        <div class="asset-grid" id="americasFundGrid">
          <div class="loading">加载基金...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 市场标签切换
    document.querySelectorAll('.market-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.market-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const market = btn.dataset.market;
        document.querySelectorAll('.market-content').forEach(content => {
          content.classList.remove('active');
        });
        document.getElementById(`${market}Content`).classList.add('active');

        console.log(`切换到市场: ${market}`);
      });
    });

    console.log('市场选择模块UI测试加载完成！');
  </script>
</body>
</html>
